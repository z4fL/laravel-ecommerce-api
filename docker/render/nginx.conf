server {
    # Hardcoded to match the PORT env var set explicitly in render.yaml,
    # instead of relying on Render's auto-detection of a bound port.
    listen 10000;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        # php-fpm lives in the same container now (single-image setup for
        # Render), so this talks to localhost instead of a compose
        # service name like "app:9000".
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
